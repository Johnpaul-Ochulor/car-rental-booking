{% extends "base.html" %}
{% block content %}
<h2>Page Content</h2>
{% for page in pages %}
<form method="post" action="{{ url_for('admin.edit_page_content', page_id=page.id) }}" class="mb-4">
  <label class="form-label"><strong>{{ page.page_key }}</strong></label>
  <textarea name="content" class="form-control" rows="4">{{ page.content or "" }}</textarea>
  <button class="btn btn-primary mt-2">Save</button>
</form>
{% endfor %}
{% endblock %}
