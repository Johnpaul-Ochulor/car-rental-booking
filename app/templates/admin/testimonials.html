{% extends "base.html" %}
{% block content %}
<div class="container my-4"><h2>Moderate testimonials</h2>
<table class="table"><tr><th>User</th><th>Rating</th><th>Message</th><th>Status</th><th></th></tr>
{% for t in testimonials %}
<tr><td>{{ t.user.name }}</td><td>{{ t.rating }}</td><td>{{ t.message }}</td>
<td><span class="badge bg-{{ 'success' if t.status == 'active' else 'secondary' }}">{{ t.status }}</span></td>
<td><form method="post" action="{{ url_for('testimonials.toggle_testimonial', tid=t.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button class="btn btn-sm btn-outline-primary">Toggle</button></form></td></tr>
{% endfor %}</table></div>
{% endblock %}
